<script>
    // ============================================================
// PASSWORD EYE TOGGLE
// ============================================================
function attachPasswordEyes() {
    var passwordInputs = document.querySelectorAll('input[type="password"]');

    passwordInputs.forEach(function(input) {
        if (input.dataset.pwWrapped === '1') return;
        input.dataset.pwWrapped = '1';

        var wrap = document.createElement('div');
        wrap.className = 'pw-wrap';

        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pw-toggle';
        btn.title = 'Show password';
        btn.innerHTML = '<i class="fas fa-eye"></i>';

        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.classList.toggle('showing', isPassword);
            btn.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
            btn.title = isPassword ? 'Hide password' : 'Show password';
        });

        wrap.appendChild(btn);
    });
}

document.addEventListener('DOMContentLoaded', attachPasswordEyes);
// ============================================================
// CONFIG
// ============================================================
var API = 'https://api.nabztech.com/api';
var refreshTimer = null;
var lastOrderIds = [];

// ============================================================
// XSS PROTECTION
// ============================================================
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============================================================
// AUDIO ALERT
// ============================================================
var alertSoundEl = null;

var _audioUnlocked = false;

function unlockAudio() {
    if (!alertSoundEl) {
        alertSoundEl = document.getElementById('alertSound');
    }
    if (!alertSoundEl) return;

    // Play muted — this is allowed even without a gesture on most browsers,
    // and it "blesses" the element so future play() calls work.
    alertSoundEl.muted = true;
    alertSoundEl.currentTime = 0;
    var p = alertSoundEl.play();
    if (p && p.then) {
        p.then(function() {
            alertSoundEl.pause();
            alertSoundEl.currentTime = 0;
            alertSoundEl.muted = false;
            _audioUnlocked = true;
            console.log('>>> audio unlocked');
        }).catch(function(err) {
            alertSoundEl.muted = false;
            console.log('>>> unlock failed:', err.name);
        });
    } else {
        alertSoundEl.muted = false;
    }
}
var _alertAC = null;
function _playWebAudioBeep() {
    try {
        if (!_alertAC) {
            _alertAC = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (_alertAC.state === 'suspended') _alertAC.resume();

        var now = _alertAC.currentTime;
        [880, 1100, 880].forEach(function(freq, i) {
            var osc = _alertAC.createOscillator();
            var gain = _alertAC.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            var start = now + (i * 0.22);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.6, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.20);
            osc.connect(gain);
            gain.connect(_alertAC.destination);
            osc.start(start);
            osc.stop(start + 0.22);
        });
    } catch (e) {
        console.warn('Web Audio beep failed:', e);
    }
}

document.addEventListener('DOMContentLoaded', function() {

    });

    // Unlock audio on the very first user tap anywhere (multiple events for safety)
    ['touchstart', 'touchend', 'click', 'keydown'].forEach(function(evt) {
        document.addEventListener(evt, unlockAudio, { once: true, passive: true });
    });

    var token = localStorage.getItem('driverToken');
    if (token) {
        showApp();
    }

    initPullToRefresh();
});

// ============================================================
// PULL TO REFRESH
// ============================================================
function initPullToRefresh() {
    var pullStartY = 0;
    var pullTriggered = false;

    document.addEventListener('touchstart', function(e) {
        if (window.scrollY === 0) {
            pullStartY = e.touches[0].clientY;
            pullTriggered = false;
        }
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
        if (window.scrollY === 0 && pullStartY > 0 && !pullTriggered) {
            var dist = e.touches[0].clientY - pullStartY;
            if (dist > 80) {
                pullTriggered = true;
                var indicator = document.getElementById('pullRefresh');
                if (indicator) {
                    indicator.classList.add('visible');
                    loadOrders(false);
                    setTimeout(function() {
                        indicator.classList.remove('visible');
                    }, 800);
                }
            }
        }
    }, { passive: true });

    document.addEventListener('touchend', function() {
        pullStartY = 0;
    });
}

// ============================================================
// NEW ORDER DETECTION — vibrate + beep
// ============================================================
function checkForNewOrders(orders) {
    var currentIds = (orders || []).map(function(o) { return String(o.id); });

    // First load — remember, and beep if there are already orders waiting
    if (lastOrderIds.length === 0) {
        lastOrderIds = currentIds;
        if (currentIds.length > 0) {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
            playAlertBeep();
            showNotification('🚗 You have ' + currentIds.length + ' active order(s)');
        }
        return;
    }

    // Find orders that are new since last check
    var newOnes = currentIds.filter(function(id) {
        return lastOrderIds.indexOf(id) === -1;
    });

    if (newOnes.length > 0) {
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 200]);
        }
        playAlertBeep();
        showNotification('🚗 New delivery assigned!');
    }

    lastOrderIds = currentIds;
}

// ============================================================
// LOGIN / LOGOUT
// ============================================================
function doLogin() {
    unlockAudio();

    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errorEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');

    errorEl.textContent = '';

    if (!username || !password) {
        errorEl.textContent = '❌ Enter username and password';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    fetch(API + '/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(function(res) {
        return res.json().then(function(d) { return { ok: res.ok, status: res.status, data: d }; });
    })
    .then(function(result) {
        if (!result.ok) {
            errorEl.textContent = '❌ ' + (result.data.error || 'Invalid credentials');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            return;
        }

        var token = result.data.token;
        var payload;
        try {
            payload = JSON.parse(atob(token.split('.')[1]));
        } catch (e) {
            errorEl.textContent = '❌ Invalid token';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            return;
        }

        if (payload.role !== 'driver') {
            errorEl.textContent = '❌ This account is not a driver';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            return;
        }

        localStorage.setItem('driverToken', token);
        localStorage.setItem('driverName', result.data.username);
        document.getElementById('loginPassword').value = '';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        showApp();
    })
    .catch(function(err) {
        console.error('Login error:', err);
        errorEl.textContent = '❌ Network error. Try again.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    });
}
function doLogout() {
    if (!confirm('Log out?')) return;
    localStorage.removeItem('driverToken');
    localStorage.removeItem('driverName');
    if (refreshTimer) clearInterval(refreshTimer);
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
}

function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';

    // Re-unlock audio whenever the app returns to foreground
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) unlockAudio();
    });

    // Re-unlock on every tap inside the app — keeps activation fresh
    document.getElementById('appScreen').addEventListener('touchstart', unlockAudio, { passive: true });
    document.getElementById('appScreen').addEventListener('click', unlockAudio);

    var name = localStorage.getItem('driverName') || 'Driver';
    document.getElementById('driverName').textContent = name;

    loadOrders();

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function() { loadOrders(false); }, 10000);
}
    // Auto-refresh history every 30s if the history tab is open
    setInterval(function() {
        var historyContent = document.getElementById('tabHistoryContent');
        if (historyContent && historyContent.style.display !== 'none') {
            loadDriverHistory(false);
        }
    }, 30000);

// AUTH-FETCH HELPER
// ============================================================
function authFetch(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    var token = localStorage.getItem('driverToken');
    if (token) options.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, options);
}

// ============================================================
// NAVIGATION URL — Google Maps
// ============================================================
function getNavigationUrl(lat, lng, address) {
    if (lat && lng) {
        return 'https://maps.google.com/?daddr=' + lat + ',' + lng;
    }
    return 'https://maps.google.com/?daddr=' + encodeURIComponent(address || '');
}

// ============================================================
// PAYMENT STATUS HELPER
// ============================================================
function getPaymentInfo(method) {
    var m = (method || 'Cash on Delivery').toLowerCase();
    var isCash = (m === 'cash on delivery' || m === 'cash' || m === 'cod');

    if (isCash) {
        return {
            isCash: true,
            icon: '💵',
            methodLabel: 'Cash on Delivery',
            bannerClass: 'collect',
            bannerIcon: 'fa-hand-holding-dollar',
            bannerText: 'COLLECT CASH FROM CUSTOMER'
        };
    }

    var methodLabel = method || 'Paid Online';
    var icon = '💳';
    if (m.indexOf('benefit') !== -1) { icon = '📱'; methodLabel = 'Benefit Pay'; }
    else if (m.indexOf('card') !== -1) { icon = '💳'; methodLabel = 'Credit/Debit Card'; }
    else if (m.indexOf('apple') !== -1) { icon = '🍎'; methodLabel = 'Apple Pay'; }
    else if (m.indexOf('google') !== -1) { icon = '🤖'; methodLabel = 'Google Pay'; }

    return {
        isCash: false,
        icon: icon,
        methodLabel: methodLabel,
        bannerClass: 'paid',
        bannerIcon: 'fa-circle-check',
        bannerText: 'ALREADY PAID — DO NOT COLLECT'
    };
}

// ============================================================
function loadDriverHistory(showFeedback) {
    var container = document.getElementById('historyContainer');
    if (!container) return;

    var days = document.getElementById('historyDaysFilter').value || 7;

    container.innerHTML = '<div class="pull-indicator">Loading history...</div>';

    authFetch(API + '/driver/history?days=' + days)
        .then(function(res) {
            if (res.status === 401) {
                doLogout();
                return null;
            }
            return res.json();
        })
        .then(function(orders) {
            if (!orders) return;
            renderHistory(orders);
            if (showFeedback) showNotification('🔄 Refreshed');
        })
        .catch(function(err) {
            console.error('History load error:', err);
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Could not load history</p></div>';
        });
}

function renderHistory(orders) {
    var container = document.getElementById('historyContainer');

    // Calculate today's stats
    var todayStr = new Date().toISOString().split('T')[0];
    var todayCount = 0;
    var todayCash = 0;

    orders.forEach(function(o) {
        var orderDate = new Date(o.created_at).toISOString().split('T')[0];
        if (orderDate === todayStr && o.status === 'Delivered') {
            todayCount++;
            var payment = (o.payment_method || '').toLowerCase();
            if (payment === 'cash on delivery' || payment === 'cash' || payment === 'cod') {
                todayCash += parseFloat(o.total) || 0;
            }
        }
    });

    document.getElementById('todayCount').textContent = todayCount;
    document.getElementById('todayCash').textContent = 'BD ' + todayCash.toFixed(2);

    // Empty state
    if (orders.length === 0) {
        container.innerHTML =
            '<div class="empty-state">' +
                '<i class="fas fa-history"></i>' +
                '<p>No deliveries in this period</p>' +
                '<p class="sub">Completed deliveries will appear here</p>' +
            '</div>';
        return;
    }

    // Group by date
    var byDate = {};
    orders.forEach(function(o) {
        var date = new Date(o.created_at).toISOString().split('T')[0];
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(o);
    });

    var dateKeys = Object.keys(byDate).sort().reverse();

    var html = '';
    dateKeys.forEach(function(date) {
        var dayLabel = formatHistoryDate(date);
        html += '<div class="history-day-header">' + dayLabel + '</div>';

            byDate[date].forEach(function(o) {
            var isCancelled = o.status === 'Cancelled';
            var d = new Date(o.created_at);
            var time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            var fullDate = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            var total = parseFloat(o.total) || 0;

            html += '<div class="history-card' + (isCancelled ? ' cancelled' : '') + '">' +
                '<div class="h-header">' +
                    '<span class="h-order">Order #' + o.id + '</span>' +
                    '<span class="h-status ' + (isCancelled ? 'cancelled' : 'delivered') + '">' +
                        (isCancelled ? 'Cancelled' : 'Delivered') +
                    '</span>' +
                '</div>' +
                '<div class="h-detail"><i class="fas fa-calendar"></i> ' + fullDate + '</div>' +
                '<div class="h-detail"><i class="fas fa-clock"></i> ' + time + '</div>' +
                '<div class="h-detail"><i class="fas fa-user"></i> ' + escapeHtml(o.customer_name || '-') + '</div>' +
                '<div class="h-detail"><i class="fas fa-map-pin"></i> ' + escapeHtml(o.customer_address || '-') + '</div>' +
                (isCancelled ? '' : '<div class="h-amount">BD ' + total.toFixed(2) + '</div>') +
            '</div>';
        });
    });

    container.innerHTML = html;
}

function formatHistoryDate(dateStr) {
    var date = new Date(dateStr + 'T00:00:00');
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.getTime() === today.getTime()) return '📅 Today';
    if (date.getTime() === yesterday.getTime()) return '📅 Yesterday';

    return '📅 ' + date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

function loadOrders(showFeedback) {
    authFetch(API + '/driver/orders')
        .then(function(res) {

            }
            return res.json();

// ============================================================
// RENDER ORDERS
// ============================================================
function renderOrders(orders) {
    var container = document.getElementById('ordersContainer');
    var countEl = document.getElementById('activeCount');
    var cashEl = document.getElementById('totalCash');

    if (!orders || orders.length === 0) {
        container.innerHTML =
            '<div class="empty-state">' +
                '<i class="fas fa-box-open"></i>' +
                '<p>No active deliveries</p>' +
                '<p class="sub">New orders will appear here automatically</p>' +
            '</div>';
        countEl.textContent = '0';
        cashEl.textContent = 'BD 0';
        return;
    }

    // Total cash only counts CASH orders
    var totalCash = 0;
    orders.forEach(function(o) {
        var payInfo = getPaymentInfo(o.payment_method);
        if (payInfo.isCash) {
            totalCash += parseFloat(o.total) || 0;
        }
    });
    countEl.textContent = orders.length;
    cashEl.textContent = 'BD ' + totalCash.toFixed(2);

    var html = '';
    orders.forEach(function(order) {
        var pay = getPaymentInfo(order.payment_method);
        var orderTotal = parseFloat(order.total) || 0;

        var navUrl = getNavigationUrl(order.latitude, order.longitude, order.customer_address);
        var cleanPhone = (order.customer_phone || '').replace(/[^0-9+]/g, '');

        // Payment banner text — show amount if cash
        var bannerText = pay.isCash
            ? 'COLLECT BD ' + orderTotal.toFixed(2) + ' IN CASH'
            : pay.bannerText;

        // ETA button state
        var etaBtnClass = order.eta_minutes ? 'btn-eta done' : 'btn-eta';
        var etaBtnLabel = order.eta_minutes
            ? '⏱️ ' + order.eta_minutes + ' min'
            : 'Set ETA';

        html +=
            '<div class="order-card">' +
                '<div class="order-header">' +
                    '<div class="order-id">Order <span>#' + order.id + '</span></div>' +
                    '<div class="order-total">BD ' + orderTotal.toFixed(2) + '</div>' +
                '</div>' +

                // ===== PAYMENT BANNER =====
                '<div class="payment-banner ' + pay.bannerClass + '">' +
                    '<i class="fas ' + pay.bannerIcon + '"></i>' +
                    '<span>' + bannerText + '</span>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-user"></i>' +
                    '<span>' + escapeHtml(order.customer_name || 'Customer') + '</span>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-phone"></i>' +
                    '<a href="tel:' + cleanPhone + '">' + escapeHtml(order.customer_phone || '-') + '</a>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-map-pin"></i>' +
                    '<span>' + escapeHtml(order.customer_address || '-') + '</span>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-' + (pay.isCash ? 'money-bill-wave' : 'credit-card') + '"></i>' +
                    '<span>' + pay.icon + ' ' + pay.methodLabel + '</span>' +
                '</div>' +

                (order.latitude && order.longitude ?
                    '<div class="order-row">' +
                        '<i class="fas fa-check-circle" style="color:#27ae60;"></i>' +
                        '<span style="color:#27ae60; font-size:0.85em;">📍 GPS pin available</span>' +
                    '</div>'
                    :
                    '<div class="order-row">' +
                        '<i class="fas fa-info-circle" style="color:#f39c12;"></i>' +
                        '<span style="color:#f39c12; font-size:0.85em;">No GPS — using address text</span>' +
                    '</div>'
                ) +

                '<div class="action-row">' +
                    '<a class="action-btn btn-navigate" href="' + navUrl + '" target="_blank" rel="noopener">' +
                        '<i class="fas fa-location-arrow"></i> Navigate' +
                    '</a>' +
                    '<a class="action-btn btn-call" href="tel:' + cleanPhone + '">' +
                        '<i class="fas fa-phone"></i> Call' +
                    '</a>' +
                    '<button class="action-btn ' + etaBtnClass + '" onclick="openEtaPicker(' + order.id + ')">' +
                        '<i class="fas fa-clock"></i> ' + etaBtnLabel +
                    '</button>' +
                    '<button class="action-btn btn-deliver" onclick="confirmDelivered(' + order.id + ')">' +
                        '<i class="fas fa-check"></i> Delivered' +
                    '</button>' +
                    '<button class="action-btn btn-report" onclick="reportProblem(' + order.id + ')">' +
                        '<i class="fas fa-exclamation-triangle"></i> Report Problem' +
                    '</button>' +
                '</div>' +
            '</div>';
    });

    container.innerHTML = html;
}

// ============================================================
function openEtaPicker(orderId) {
    var options = [2, 5, 10, 15, 20, 25, 30, 40, 50, 60];

    var html = '<div class="confirm-box">' +
        '<h2>⏱️ How many minutes to arrive?</h2>' +
        '<p>Check Google Maps and enter the ETA shown.</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">';

    options.forEach(function(min) {
        html += '<button class="eta-option" onclick="submitEta(' + orderId + ',' + min + ')">' + min + ' min</button>';
    });

    html += '</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:12px;">' +
            '<input type="number" id="customEta" placeholder="Other" min="1" max="240" style="flex:1;padding:12px;border-radius:10px;border:2px solid #3a3a55;background:#1e1e2e;color:#fff;font-size:1em;">' +
            '<button class="eta-option" style="padding:12px 20px;" onclick="submitEta(' + orderId + ', parseInt(document.getElementById(\'customEta\').value))">OK</button>' +
        '</div>' +
        '<button class="confirm-no" style="width:100%;padding:12px;border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer;" onclick="closeConfirm()">Cancel</button>' +
    '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.id = 'confirmOverlay';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
}

function submitEta(orderId, minutes) {
    if (!minutes || minutes < 1 || minutes > 240) {
        alert('Enter a number between 1 and 240');
        return;
    }

    authFetch(API + '/driver/orders/' + orderId + '/eta', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eta_minutes: minutes })
    })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
    .then(function(result) {
        if (!result.ok) {
            alert('❌ ' + (result.data.error || 'Failed'));
            return;
        }
        closeConfirm();
        showNotification('⏱️ Customer notified — ' + minutes + ' minutes');
        loadOrders(false);
    })
    .catch(function(err) {
        console.error('ETA error:', err);
        alert('❌ Network error');
    });
}

    overlay.id = 'confirmOverlay';

        '<p>Order <strong>#' + orderId + '</strong></p>' +

        '<button class="confirm-no" style="width:100%;padding:12px;border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer;" onclick="closeConfirm()">Cancel</button>' +
    '</div>';

function submitProblem(orderId, reason) {
    closeConfirm();
    showNotification('Sending report...');

    authFetch(API + '/driver/orders/' + orderId + '/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason: reason })
    })
    .then(function(res) {
        return res.json().then(function(d) { return { ok: res.ok, data: d }; });
    })
    .then(function(result) {
        if (!result.ok) {
            alert('❌ ' + (result.data.error || 'Failed to send report'));
            return;
        }
        showNotification('✅ Report sent to admin');
    })
    .catch(function(err) {
        console.error('Report error:', err);
        alert('❌ Network error — please call the admin directly');
    });
}
// ============================================================
// NOTIFICATION
// ============================================================
function showNotification(message) {
    var existing = document.querySelector('.notification');
    if (existing) existing.remove();
    var div = document.createElement('div');
    div.className = 'notification';
    div.textContent = message;
    document.body.appendChild(div);
    setTimeout(function() { div.remove(); }, 2500);
}
</script>
