<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🚗 Driver — Nabz-Tech Eats</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#9b59b6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body { overflow-x: hidden; }
        body {
            background: #1e1e2e;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* ===== LOGIN ===== */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #1e1e2e 0%, #2c2c44 100%);
        }
        .login-box {
            background: #2c2c44;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border-top: 5px solid #9b59b6;
        }
        .login-box h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
            font-size: 1.6em;
        }
        .login-box .subtitle {
            text-align: center;
            color: #a0a0b8;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #d0d0e0;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #3a3a55;
            border-radius: 10px;
            font-size: 1em;
            background: #1e1e2e;
            color: #fff;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #9b59b6;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover { background: #8e44ad; }
        .login-btn:disabled { background: #555; cursor: not-allowed; }
        .error-msg {
            color: #ff6b6b;
            font-size: 0.9em;
            min-height: 22px;
            margin-top: 12px;
            text-align: center;
        }

        /* ===== MAIN APP ===== */
        #appScreen {
            display: none;
            max-width: 700px;
            margin: 0 auto;
            padding: 15px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c2c44;
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .topbar .driver-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.95em;
        }
        .topbar .driver-name i { color: #9b59b6; margin-right: 6px; }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
        }
        .logout-btn:hover { background: #c0392b; }

        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #2c2c44;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #9b59b6;
        }
        .stat-box .num {
            font-size: 1.8em;
            font-weight: bold;
            color: #9b59b6;
        }
        .stat-box .lbl {
            font-size: 0.75em;
            color: #a0a0b8;
            margin-top: 4px;
        }

        .section-title {
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 15px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .refresh-btn {
            margin-left: auto;
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 600;
        }

        .order-card {
            background: #2c2c44;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border-left: 5px solid #9b59b6;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #3a3a55;
        }
        .order-id {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
        }
        .order-id span {
            color: #9b59b6;
        }
        .order-total {
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        /* ===== PAYMENT BANNER ===== */
        .payment-banner {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-weight: 700;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
            justify-content: center;
        }
        .payment-banner.collect {
            background: #27ae60;
            color: #fff;
            border: 2px solid #1e8449;
            animation: pulse-green 2s infinite;
        }
        .payment-banner.paid {
            background: #2980b9;
            color: #fff;
            border: 2px solid #1f6391;
        }
        .payment-banner i {
            font-size: 1.3em;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.6); }
            50% { box-shadow: 0 0 0 8px rgba(39, 174, 96, 0); }
        }

        .order-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            color: #d0d0e0;
            font-size: 0.92em;
        }
        .order-row i {
            color: #9b59b6;
            width: 20px;
            text-align: center;
            font-size: 1.05em;
        }
        .order-row a {
            color: #3498db;
            text-decoration: none;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .action-btn {
            padding: 14px 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.92em;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .action-btn:active { transform: scale(0.97); }
        .btn-navigate {
            background: #3498db;
            grid-column: 1 / -1;
        }
        .btn-navigate:hover { background: #2980b9; }
        .btn-call { background: #27ae60; }
        .btn-call:hover { background: #1e8449; }
        .btn-eta { background: #f39c12; }
        .btn-eta:hover { background: #d68910; }
        .btn-eta.done { background: #7f8c8d; }
        .btn-deliver {
            background: #9b59b6;
            grid-column: 1 / -1;
        }
        .btn-deliver:hover { background: #8e44ad; }

        .eta-option {
            padding: 12px 8px;
            border: none;
            border-radius: 10px;
            background: #9b59b6;
            color: white;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .eta-option:hover { background: #8e44ad; }

        .empty-state {
            background: #2c2c44;
            border-radius: 14px;
            padding: 60px 20px;
            text-align: center;
            color: #a0a0b8;
        }
        .empty-state i {
            font-size: 3.5em;
            color: #4a4a6a;
            margin-bottom: 15px;
            display: block;
        }
        .empty-state p {
            font-size: 1em;
            margin-bottom: 6px;
        }
        .empty-state .sub {
            font-size: 0.85em;
            color: #7070a0;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            max-width: 400px;
            margin-left: auto;
            background: #27ae60;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            z-index: 9999;
            font-weight: 600;
            font-size: 0.95em;
            text-align: center;
        }

        .confirm-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .confirm-box {
            background: #2c2c44;
            border-radius: 16px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #9b59b6;
        }
        .confirm-box h2 {
            color: #fff;
            font-size: 1.3em;
            margin-bottom: 12px;
        }
        .confirm-box p {
            color: #a0a0b8;
            font-size: 0.95em;
            margin-bottom: 22px;
            line-height: 1.4;
        }
        .confirm-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .confirm-btns button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
        }
        .confirm-yes { background: #27ae60; color: white; }
        .confirm-no { background: #555; color: white; }

        .pull-indicator {
            text-align: center;
            color: #7070a0;
            font-size: 0.8em;
            padding: 8px 0;
        }

        @media (max-width: 480px) {
            .topbar { padding: 12px 16px; }
            .topbar .driver-name { font-size: 0.88em; }
            .action-row { gap: 8px; }
            .action-btn { padding: 12px 10px; font-size: 0.85em; }
            .payment-banner { font-size: 0.88em; padding: 10px 14px; }
        }
        /* Pull to refresh indicator */
#pullRefresh {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 12px;
    background: #9b59b6;
    color: #fff;
    font-weight: 600;
    transform: translateY(-100%);
    transition: transform 0.2s;
    z-index: 9998;
}
#pullRefresh.visible {
    transform: translateY(0);
}
    </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
    <div class="login-box">
        <h1>🚗 Driver Login</h1>
        <p class="subtitle">Nabz-Tech Eats Delivery</p>

        <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input type="text" id="loginUsername" placeholder="Your driver username" autocomplete="username">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password">
        </div>

        <button class="login-btn" id="loginBtn" onclick="doLogin()">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <div class="error-msg" id="loginError"></div>
    </div>
</div>

<!-- ===== APP SCREEN ===== -->
<div id="appScreen">
    <div class="topbar">
        <div class="driver-name">
            <i class="fas fa-motorcycle"></i>
            <span id="driverName">Driver</span>
        </div>
        <button class="logout-btn" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <div class="num" id="activeCount">0</div>
            <div class="lbl">ACTIVE DELIVERIES</div>
        </div>
        <div class="stat-box">
            <div class="num" id="totalCash">BD 0</div>
            <div class="lbl">CASH TO COLLECT</div>
        </div>
    </div>

    <div class="section-title">
        <i class="fas fa-box"></i> My Deliveries
        <button class="refresh-btn" onclick="loadOrders(true)">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>

    <div id="ordersContainer">
        <div class="pull-indicator">Loading...</div>
    </div>
    <div id="pullRefresh"><i class="fas fa-sync"></i> Refreshing...</div>
</div>
'<div style="text-align:center;color:#7070a0;font-size:0.8em;margin-bottom:12px;">' +
    'Auto-refreshes every 10s · Last: ' + new Date().toLocaleTimeString() +
'</div>'
<script>
    // ============================================================
// TRACK LAST ORDER COUNT — for new delivery alerts
// ============================================================
var lastOrderIds = [];


function checkForNewOrders(orders) {
    var currentIds = (orders || []).map(function(o) { return o.id; });

    // First load — just remember, don't alert
    if (lastOrderIds.length === 0) {
        lastOrderIds = currentIds;
        return;
    }

    // Find orders that are new since last check
    var newOnes = currentIds.filter(function(id) {
        return lastOrderIds.indexOf(id) === -1;
    });

    if (newOnes.length > 0) {
        // Vibrate (mobile only, harmless on desktop)
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 200]);
        }

        // Beep using Web Audio
        try {
            var ac = new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            [880, 1100].forEach(function(freq, i) {
                var osc = ac.createOscillator();
                var gain = ac.createGain();
                osc.frequency.value = freq;
                var s = ac.currentTime + (i * 0.18);
                gain.gain.setValueAtTime(0.3, s);
                gain.gain.linearRampToValueAtTime(0, s + 0.18);
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start(s);
                osc.stop(s + 0.18);
            });
        } catch (e) { /* ignore */ }

        showNotification('🚗 New delivery assigned!');
    }

    lastOrderIds = currentIds;
}
// ============================================================
// CONFIG
// ============================================================
var API = 'https://api.nabztech.com/api';
var refreshTimer = null;
// ============================================================
// XSS PROTECTION
// ============================================================
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loginPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doLogin();
    });

    var token = localStorage.getItem('driverToken');
    if (token) {
        showApp();
    }
    var pullStartY = 0;
var pullTriggered = false;

document.addEventListener('touchstart', function(e) {
    if (window.scrollY === 0) {
        pullStartY = e.touches[0].clientY;
        pullTriggered = false;
    }
}, { passive: true });

document.addEventListener('touchmove', function(e) {
    if (window.scrollY === 0 && pullStartY > 0 && !pullTriggered) {
        var dist = e.touches[0].clientY - pullStartY;
        if (dist > 80) {
            pullTriggered = true;
            var indicator = document.getElementById('pullRefresh');
            if (indicator) {
                indicator.classList.add('visible');
                loadOrders(false);
                setTimeout(function() {
                    indicator.classList.remove('visible');
                }, 800);
            }
        }
    }
}, { passive: true });

document.addEventListener('touchend', function() {
    pullStartY = 0;
});

// ============================================================
// LOGIN / LOGOUT
// ============================================================
function doLogin() {
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errorEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');

    errorEl.textContent = '';

    if (!username || !password) {
        errorEl.textContent = '❌ Enter username and password';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    fetch(API + '/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(function(res) {
        return res.json().then(function(d) { return { ok: res.ok, status: res.status, data: d }; });
    })
    .then(function(result) {
        if (!result.ok) {
            errorEl.textContent = '❌ ' + (result.data.error || 'Invalid credentials');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            return;
        }

        var token = result.data.token;
        var payload;
        try {
            payload = JSON.parse(atob(token.split('.')[1]));
        } catch (e) {
            errorEl.textContent = '❌ Invalid token';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            return;
        }

        if (payload.role !== 'driver') {
            errorEl.textContent = '❌ This account is not a driver';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            return;
        }

        localStorage.setItem('driverToken', token);
        localStorage.setItem('driverName', result.data.username);
        document.getElementById('loginPassword').value = '';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        showApp();
    })
    .catch(function(err) {
        console.error('Login error:', err);
        errorEl.textContent = '❌ Network error. Try again.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    });
}

function doLogout() {
    if (!confirm('Log out?')) return;
    localStorage.removeItem('driverToken');
    localStorage.removeItem('driverName');
    if (refreshTimer) clearInterval(refreshTimer);
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
}

function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';

    var name = localStorage.getItem('driverName') || 'Driver';
    document.getElementById('driverName').textContent = name;

    loadOrders();

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function() { loadOrders(false); }, 10000);
}

// ============================================================
// AUTH-FETCH HELPER
// ============================================================
function authFetch(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    var token = localStorage.getItem('driverToken');
    if (token) options.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, options);
}

// ============================================================
// NAVIGATION URL — Google Maps
// ============================================================
function getNavigationUrl(lat, lng, address) {
    if (lat && lng) {
        return 'https://maps.google.com/?daddr=' + lat + ',' + lng;
    }
    return 'https://maps.google.com/?daddr=' + encodeURIComponent(address || '');
}

// ============================================================
// PAYMENT STATUS HELPER
// ============================================================
function getPaymentInfo(method) {
    var m = (method || 'Cash on Delivery').toLowerCase();
    var isCash = (m === 'cash on delivery' || m === 'cash' || m === 'cod');

    if (isCash) {
        return {
            isCash: true,
            icon: '💵',
            methodLabel: 'Cash on Delivery',
            bannerClass: 'collect',
            bannerIcon: 'fa-hand-holding-dollar',
            bannerText: 'COLLECT CASH FROM CUSTOMER'
        };
    }

    var methodLabel = method || 'Paid Online';
    var icon = '💳';
    if (m.indexOf('benefit') !== -1) { icon = '📱'; methodLabel = 'Benefit Pay'; }
    else if (m.indexOf('card') !== -1) { icon = '💳'; methodLabel = 'Credit/Debit Card'; }
    else if (m.indexOf('apple') !== -1) { icon = '🍎'; methodLabel = 'Apple Pay'; }
    else if (m.indexOf('google') !== -1) { icon = '🤖'; methodLabel = 'Google Pay'; }

    return {
        isCash: false,
        icon: icon,
        methodLabel: methodLabel,
        bannerClass: 'paid',
        bannerIcon: 'fa-circle-check',
        bannerText: 'ALREADY PAID — DO NOT COLLECT'
    };
}

// ============================================================
// LOAD ORDERS
// ============================================================
function loadOrders(showFeedback) {
    authFetch(API + '/driver/orders')
        .then(function(res) {
            if (res.status === 401) {
                doLogout();
                return null;
            }
            return res.json();
        })
        .then(function(orders) {
            if (!orders) return;
            renderOrders(orders);
            if (showFeedback) showNotification('🔄 Refreshed');
        })
        .catch(function(err) {
            console.error('Load orders error:', err);
            document.getElementById('ordersContainer').innerHTML =
                '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Could not load orders</p><p class="sub">Check your connection</p></div>';
        })
        .then(function(orders) {
    if (!orders) return;
    checkForNewOrders(orders);   // ← add this line
    renderOrders(orders);
    if (showFeedback) showNotification('🔄 Refreshed');
})
}

// ============================================================
// RENDER ORDERS
// ============================================================
function renderOrders(orders) {
    var container = document.getElementById('ordersContainer');
    var countEl = document.getElementById('activeCount');
    var cashEl = document.getElementById('totalCash');

    if (!orders || orders.length === 0) {
        container.innerHTML =
            '<div class="empty-state">' +
                '<i class="fas fa-box-open"></i>' +
                '<p>No active deliveries</p>' +
                '<p class="sub">New orders will appear here automatically</p>' +
            '</div>';
        countEl.textContent = '0';
        cashEl.textContent = 'BD 0';
        return;
    }

    // Total cash only counts CASH orders
    var totalCash = 0;
    orders.forEach(function(o) {
        var payInfo = getPaymentInfo(o.payment_method);
        if (payInfo.isCash) {
            totalCash += parseFloat(o.total) || 0;
        }
    });
    countEl.textContent = orders.length;
    cashEl.textContent = 'BD ' + totalCash.toFixed(2);

    var html = '';
    orders.forEach(function(order) {
        var pay = getPaymentInfo(order.payment_method);
        var orderTotal = parseFloat(order.total) || 0;

        var navUrl = getNavigationUrl(order.latitude, order.longitude, order.customer_address);
        var cleanPhone = (order.customer_phone || '').replace(/[^0-9+]/g, '');

        // Payment banner text — show amount if cash
        var bannerText = pay.isCash
            ? 'COLLECT BD ' + orderTotal.toFixed(2) + ' IN CASH'
            : pay.bannerText;

        // ETA button state
        var etaBtnClass = order.eta_minutes ? 'btn-eta done' : 'btn-eta';
        var etaBtnLabel = order.eta_minutes
            ? '⏱️ ' + order.eta_minutes + ' min'
            : 'Set ETA';

        html +=
            '<div class="order-card">' +
                '<div class="order-header">' +
                    '<div class="order-id">Order <span>#' + order.id + '</span></div>' +
                    '<div class="order-total">BD ' + orderTotal.toFixed(2) + '</div>' +
                '</div>' +

                // ===== PAYMENT BANNER =====
                '<div class="payment-banner ' + pay.bannerClass + '">' +
                    '<i class="fas ' + pay.bannerIcon + '"></i>' +
                    '<span>' + bannerText + '</span>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-user"></i>' +
                    '<span>' + escapeHtml(order.customer_name || 'Customer') + '</span>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-phone"></i>' +
                   '<a href="tel:' + cleanPhone + '">' + escapeHtml(order.customer_phone || '-') + '</a>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-map-pin"></i>' +
                   '<span>' + escapeHtml(order.customer_address || '-') + '</span>' +
                '</div>' +

                '<div class="order-row">' +
                    '<i class="fas fa-' + (pay.isCash ? 'money-bill-wave' : 'credit-card') + '"></i>' +
                    '<span>' + pay.icon + ' ' + pay.methodLabel + '</span>' +
                '</div>' +

                (order.latitude && order.longitude ?
                    '<div class="order-row">' +
                        '<i class="fas fa-check-circle" style="color:#27ae60;"></i>' +
                        '<span style="color:#27ae60; font-size:0.85em;">📍 GPS pin available</span>' +
                    '</div>'
                    :
                    '<div class="order-row">' +
                        '<i class="fas fa-info-circle" style="color:#f39c12;"></i>' +
                        '<span style="color:#f39c12; font-size:0.85em;">No GPS — using address text</span>' +
                    '</div>'
                ) +

                '<div class="action-row">' +
                    '<a class="action-btn btn-navigate" href="' + navUrl + '" target="_blank" rel="noopener">' +
                        '<i class="fas fa-location-arrow"></i> Navigate' +
                    '</a>' +
                    '<a class="action-btn btn-call" href="tel:' + cleanPhone + '">' +
                        '<i class="fas fa-phone"></i> Call' +
                    '</a>' +
                    '<button class="action-btn ' + etaBtnClass + '" onclick="openEtaPicker(' + order.id + ')">' +
                        '<i class="fas fa-clock"></i> ' + etaBtnLabel +
                    '</button>' +
                    '<button class="action-btn btn-deliver" onclick="confirmDelivered(' + order.id + ')">' +
                        '<i class="fas fa-check"></i> Delivered' +
                    '</button>' +
                    '<button class="action-btn" style="background:#e67e22;grid-column:1/-1;" onclick="reportProblem(' + order.id + ')">' +
    '<i class="fas fa-exclamation-triangle"></i> Report Problem' +
'</button>'
                '</div>' +
            '</div>';
    });

    container.innerHTML = html;
}

// ============================================================
// ETA PICKER
// ============================================================
function openEtaPicker(orderId) {
    var options = [2, 5, 10, 15, 20, 25, 30, 40, 50, 60];

    var html = '<div class="confirm-box">' +
        '<h2>⏱️ How many minutes to arrive?</h2>' +
        '<p>Check Google Maps and enter the ETA shown.</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">';

    options.forEach(function(min) {
        html += '<button class="eta-option" onclick="submitEta(' + orderId + ',' + min + ')">' + min + ' min</button>';
    });

    html += '</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:12px;">' +
            '<input type="number" id="customEta" placeholder="Other" min="1" max="240" style="flex:1;padding:12px;border-radius:10px;border:2px solid #3a3a55;background:#1e1e2e;color:#fff;font-size:1em;">' +
            '<button class="eta-option" style="padding:12px 20px;" onclick="submitEta(' + orderId + ', parseInt(document.getElementById(\'customEta\').value))">OK</button>' +
        '</div>' +
        '<button class="confirm-no" style="width:100%;padding:12px;border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer;" onclick="closeConfirm()">Cancel</button>' +
    '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.id = 'confirmOverlay';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
}

function submitEta(orderId, minutes) {
    if (!minutes || minutes < 1 || minutes > 240) {
        alert('Enter a number between 1 and 240');
        return;
    }

    authFetch(API + '/driver/orders/' + orderId + '/eta', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eta_minutes: minutes })
    })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
    .then(function(result) {
        if (!result.ok) {
            alert('❌ ' + (result.data.error || 'Failed'));
            return;
        }
        closeConfirm();
        showNotification('⏱️ Customer notified — ' + minutes + ' minutes');
        loadOrders(false);
    })
    .catch(function(err) {
        console.error('ETA error:', err);
        alert('❌ Network error');
    });
}

// ============================================================
// MARK DELIVERED
// ============================================================
function confirmDelivered(orderId) {
    var overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.id = 'confirmOverlay';
    overlay.innerHTML =
        '<div class="confirm-box">' +
            '<h2>✅ Mark as Delivered?</h2>' +
            '<p>Order <strong>#' + orderId + '</strong><br>Confirming means the food has reached the customer.</p>' +
            '<div class="confirm-btns">' +
                '<button class="confirm-no" onclick="closeConfirm()">Cancel</button>' +
                '<button class="confirm-yes" onclick="markDelivered(' + orderId + ')">Yes, Delivered</button>' +
            '</div>' +
        '</div>';
    document.body.appendChild(overlay);
}

function closeConfirm() {
    var el = document.getElementById('confirmOverlay');
    if (el) el.remove();
}

function markDelivered(orderId) {
    closeConfirm();

    authFetch(API + '/driver/orders/' + orderId + '/delivered', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
    .then(function(result) {
        if (!result.ok) {
            alert('❌ ' + (result.data.error || 'Failed to mark delivered'));
            return;
        }
        showNotification('🎉 Order #' + orderId + ' delivered!');
        loadOrders(false);
    })
    .catch(function(err) {
        console.error('Mark delivered error:', err);
        alert('❌ Network error');
    });
}
function reportProblem(orderId) {
    var reasons = ['Customer not answering', 'Wrong address', 'Traffic delay', 'Other'];
    var reason = prompt('What\'s the issue?\n\n' + reasons.map(function(r, i) { return (i + 1) + '. ' + r; }).join('\n') + '\n\nType a message:');
    if (!reason) return;

    // Just send a WhatsApp/call to admin for now
    alert('⚠️ Report sent to admin:\n\n' + reason + '\n\nPlease also call the admin if urgent.');

    // Optional: POST to a /api/driver/orders/:id/report endpoint (needs backend)
}

// ============================================================
// NOTIFICATION
// ============================================================
function showNotification(message) {
    var existing = document.querySelector('.notification');
    if (existing) existing.remove();
    var div = document.createElement('div');
    div.className = 'notification';
    div.textContent = message;
    document.body.appendChild(div);
    setTimeout(function() { div.remove(); }, 2500);
}
</script>
